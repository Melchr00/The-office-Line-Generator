
services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/keycloak_init:/opt/keycloak/data/import
    networks:
      - demo-net

  microservice:
    build: ./microservice
    ports:
      - "4000:4000"
    networks:
      - demo-net
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /tmp/openapi.yaml
    volumes:
      - ./admin-api/openapi.yaml:/tmp/openapi.yaml

volumes:
  keycloak_data:

networks:
  demo-net:
